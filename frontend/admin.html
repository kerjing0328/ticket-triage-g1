<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Ticket Triage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-admin">
    <header class="site">
        <div class="wrap">
            <div class="brand">Ticket<span>Triage</span> <span class="group-label">Group 1</span></div>
            <nav class="site">
                <a href="index.html">Submit a ticket</a>
                <a href="admin.html" class="active">Admin review</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <h1>Admin Dashboard</h1>
            <p class="subtitle">Manage and triage support tickets.</p>

            <div class="stats-bar">
                <div class="stat-item card">
                    <span class="stat-count" id="statTotal">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat-item card">
                    <span class="stat-count" id="statNew">0</span>
                    <span class="stat-label">New</span>
                </div>
                <div class="stat-item card">
                    <span class="stat-count" id="statInProgress">0</span>
                    <span class="stat-label">In Progress</span>
                </div>
                <div class="stat-item card">
                    <span class="stat-count" id="statResolved">0</span>
                    <span class="stat-label">Resolved</span>
                </div>
            </div>

            <div class="card filter-card">
                <div class="filter-bar">
                    <div class="filter-group">
                        <label for="searchEmail">Email contains</label>
                        <input type="text" id="searchEmail" placeholder="Filter by email...">
                    </div>
                    <div class="filter-group">
                        <label for="filterCategory">Category</label>
                        <select id="filterCategory">
                            <option value="">All Categories</option>
                            <option value="IT Support">IT Support</option>
                            <option value="Facilities">Facilities</option>
                            <option value="Course Registration">Course Registration</option>
                            <option value="Student Finance">Student Finance</option>
                            <option value="Library Services">Library Services</option>
                            <option value="General Enquiry">General Enquiry</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterStatus">Status</label>
                        <select id="filterStatus">
                            <option value="">All Status</option>
                            <option value="New">New</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Resolved">Resolved</option>
                        </select>
                    </div>
                    <div class="filter-actions">
                        <button class="btn btn-primary btn-sm" onclick="applyFilters()">Apply</button>
                        <button class="btn btn-secondary btn-sm" onclick="clearFilters()">Clear</button>
                    </div>
                </div>
            </div>

            <div class="card table-card">
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th>Submitted</th>
                                <th>Requester</th>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="ticketTableBody">
                            <tr><td colspan="7" class="muted" style="padding:22px;">No tickets found.</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </main>

    <div id="statusModal" class="modal hidden">
        <div class="modal-overlay" onclick="closeModal()"></div>
        <div class="modal-content">
            <h3>Update Ticket Status</h3>
            <p>Ticket <strong id="modalTicketId"></strong></p>
            <div class="form-group">
                <label for="newStatus">New Status</label>
                <select id="newStatus">
                    <option value="New">New</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="confirmStatusUpdate()">Update</button>
            </div>
        </div>
    </div>

    <div id="ticketDetailModal" class="modal hidden">
        <div class="modal-overlay" onclick="closeDetailModal()"></div>
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3>Ticket Details</h3>
                <button class="btn btn-secondary btn-sm" onclick="closeDetailModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="detail-grid">
                    <div class="detail-item">
                        <label>Ticket ID</label>
                        <span id="detailId"></span>
                    </div>
                    <div class="detail-item">
                        <label>Submitted</label>
                        <span id="detailDate"></span>
                    </div>
                    <div class="detail-item">
                        <label>Status</label>
                        <span id="detailStatus"></span>
                    </div>
                    <div class="detail-item">
                        <label>Priority</label>
                        <span id="detailPriority"></span>
                    </div>
                    <div class="detail-item">
                        <label>Category</label>
                        <span id="detailCategory"></span>
                    </div>
                    <div class="detail-item">
                        <label>Requester</label>
                        <span id="detailName"></span>
                    </div>
                    <div class="detail-item full-width">
                        <label>Email</label>
                        <span id="detailEmail"></span>
                    </div>
                    <div class="detail-item full-width">
                        <label>Title</label>
                        <span id="detailTitle"></span>
                    </div>
                    <div class="detail-item full-width">
                        <label>Description</label>
                        <p id="detailDescription"></p>
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeDetailModal()">Close</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
