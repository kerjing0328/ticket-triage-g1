<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Ticket Triage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-admin">
    <div class="container">
        <header>
            <div class="section-tag">Admin Panel</div>
            <h1>Admin Dashboard</h1>
            <p class="subtitle">Manage and triage support tickets.</p>
            <nav class="nav-links">
                <a href="index.html" class="btn-ghost btn-sm">Back to Submission</a>
            </nav>
        </header>

        <div class="filter-bar card">
            <div class="filter-group">
                <label for="searchEmail">Search by Email</label>
                <input type="text" id="searchEmail" placeholder="Filter by email...">
            </div>
            <div class="filter-group">
                <label for="filterCategory">Category</label>
                <select id="filterCategory">
                    <option value="">All Categories</option>
                    <option value="IT Support">IT Support</option>
                    <option value="Facilities">Facilities</option>
                    <option value="Course Registration">Course Registration</option>
                    <option value="Student Finance">Student Finance</option>
                    <option value="Library Services">Library Services</option>
                    <option value="General Enquiry">General Enquiry</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterStatus">Status</label>
                <select id="filterStatus">
                    <option value="">All Statuses</option>
                    <option value="New">New</option>
                    <option value="Categorised">Categorised</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                </select>
            </div>
            <button class="btn-ghost btn-sm" onclick="clearFilters()">Clear Filters</button>
        </div>

        <div class="stats-bar">
            <div class="stat-item card">
                <span class="stat-count" id="statTotal">0</span>
                <span class="stat-label">Total</span>
            </div>
            <div class="stat-item card">
                <span class="stat-count" id="statNew">0</span>
                <span class="stat-label">New</span>
            </div>
            <div class="stat-item card">
                <span class="stat-count" id="statInProgress">0</span>
                <span class="stat-label">In Progress</span>
            </div>
            <div class="stat-item card">
                <span class="stat-count" id="statResolved">0</span>
                <span class="stat-label">Resolved</span>
            </div>
        </div>

        <div id="ticketList" class="ticket-list">
            <p class="empty-state">No tickets found.</p>
        </div>
    </div>

    <div id="statusModal" class="modal hidden">
        <div class="modal-overlay" onclick="closeModal()"></div>
        <div class="modal-content">
            <h3>Update Ticket Status</h3>
            <p>Ticket <strong id="modalTicketId"></strong></p>
            <div class="form-group">
                <label for="newStatus">New Status</label>
                <select id="newStatus">
                    <option value="New">New</option>
                    <option value="Categorised">Categorised</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-ghost" onclick="closeModal()">Cancel</button>
                <button class="btn-acid" style="width:auto" onclick="confirmStatusUpdate()">Update</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
